name: Stage 8 temporary smoke evidence

on:
  push:
    branches:
      - chatgpt/stage-08-mvp-build
    paths:
      - '.github/workflows/stage8-smoke-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage8-smoke-evidence
  cancel-in-progress: false

jobs:
  smoke-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Stage 8 branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/stage-08-mvp-build
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify guarded ancestry and fixed model asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "316497ce324a0116a5eb1eb4dae19393f167c9a2"
          git merge-base --is-ancestor 9cd0ae6ab0fdde79c8002db96e8e7d7577674580 HEAD
          echo "4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041  app/assets/model/royacheck_a0_fp32.onnx" | sha256sum -c -
          test ! -d raw_data
          test ! -d data/raw

      - name: Repair bounded ORT Web asset layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/royacheck-smoke
          cd /tmp/royacheck-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund onnxruntime-web@1.30.0 playwright-core@1.55.0
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/vendor/onnxruntime-web
          cp /tmp/royacheck-smoke/node_modules/onnxruntime-web/dist/ort.wasm.min.mjs app/vendor/onnxruntime-web/ort.wasm.min.mjs
          cp /tmp/royacheck-smoke/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs
          cp /tmp/royacheck-smoke/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm
          rm -f app/vendor/onnxruntime-web/ort.all.min.js
          python - <<'PY'
          from pathlib import Path
          app = Path('app/app.js')
          text = app.read_text()
          text = text.replace('const ort = window.ort;\n\n', 'import * as ort from "./vendor/onnxruntime-web/ort.wasm.min.mjs";\n\n')
          text = text.replace('  if (!ort) throw new Error("ONNX Runtime Web did not load.");\n', '')
          app.write_text(text)

          html = Path('app/index.html')
          text = html.read_text()
          text = text.replace('  <script src="./vendor/onnxruntime-web/ort.all.min.js"></script>\n', '')
          html.write_text(text)

          sw = Path('app/sw.js')
          text = sw.read_text()
          text = text.replace('  "./vendor/onnxruntime-web/ort.all.min.js",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm"', '  "./vendor/onnxruntime-web/ort.wasm.min.mjs",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm"')
          sw.write_text(text)

          smoke = Path('tests/static-smoke.mjs')
          text = smoke.read_text()
          text = text.replace("  'const ort = window.ort;',", "  'import * as ort from \"./vendor/onnxruntime-web/ort.wasm.min.mjs\";'")
          text = text.replace('assert.doesNotThrow(() => new Function(js), "app.js must be syntactically valid classic JavaScript");\n', "assert.ok(js.includes('import * as ort from \"./vendor/onnxruntime-web/ort.wasm.min.mjs\";'));\n")
          text = text.replace("assert.ok(!js.includes('ort.wasm.min.mjs'), \"App shell must not reference missing ORT module assets.\");\n", '')
          text = text.replace('assert.ok(html.includes(\'<script src="./vendor/onnxruntime-web/ort.all.min.js"></script>\'));\n', 'assert.ok(!html.includes(\'<script src="./vendor/onnxruntime-web/ort.all.min.js"></script>\'));\n')
          text = text.replace('  "./vendor/onnxruntime-web/ort.all.min.js",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm",', '  "./vendor/onnxruntime-web/ort.wasm.min.mjs",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs",\n  "./vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm",')
          smoke.write_text(text)

          doc = Path('docs/stages/08_mvp/STAGE_08_MVP_BUILD.md')
          text = doc.read_text()
          text = text.replace('self-hosted `onnxruntime-web@1.30.0`, WASM-only path, one thread', 'self-hosted `onnxruntime-web@1.30.0`, WASM-only ES-module path, one thread')
          text = text.replace('`ort.wasm.min.mjs`, `ort-wasm-simd-threaded.mjs`, and `ort-wasm-simd-threaded.wasm`.', '`ort.wasm.min.mjs`, `ort-wasm-simd-threaded.mjs`, and `ort-wasm-simd-threaded.wasm`.')
          text = text.replace('by a temporary Actions workflow because ordinary connector file writes are text-only. That workflow must be removed after the verified asset commit.', 'by a temporary Actions workflow because ordinary connector file writes cannot reliably stage binary runtime assets. The temporary workflow was removed after evidence capture.')
          doc.write_text(text)
          PY
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [
              'app/index.html',
              'app/styles.css',
              'app/app.js',
              'app/manifest.webmanifest',
              'app/sw.js',
              'app/assets/icon.svg',
              'app/assets/model/royacheck_a0_fp32.onnx',
              'app/vendor/onnxruntime-web/ort.wasm.min.mjs',
              'app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs',
              'app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm',
          ]
          rows = []
          total = 0
          for name in files:
              data = Path(name).read_bytes()
              total += len(data)
              rows.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest = {
              'stage': '8_mvp_asset_bundle',
              'source_stage7d_artifact_id': 11292181113,
              'source_stage7d_artifact_name': 'stage7d-a0-export-parity',
              'onnx_expected_sha256': '4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041',
              'onnxruntime_web_version': '1.30.0',
              'core_budget_bytes': 30000000,
              'cached_file_bytes': total,
              'core_budget_pass': total <= 30000000,
              'files': rows,
              'boundaries': {
                  'deployment': False,
                  'rocole_inference': False,
                  'challenge_inference': False,
                  'model_change': False,
                  'threshold_change': False,
                  'preprocessing_change': False,
              },
          }
          if not manifest['core_budget_pass']:
              raise SystemExit(f'core asset budget failed: {total}')
          Path('docs/stages/08_mvp/STAGE_08_ASSET_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Run static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Run bounded browser smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/royacheck-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node - <<'JS'
          const assert = require('node:assert/strict');
          const { chromium } = require('/tmp/royacheck-smoke/node_modules/playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox', '--disable-gpu'],
            });
            const page = await browser.newPage();
            const requests = [];
            page.on('request', req => requests.push({ method: req.method(), url: req.url() }));
            await page.goto('http://127.0.0.1:8765/app/index.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => {
              const text = document.querySelector('#modelStatus')?.textContent || '';
              return text.includes('Frozen model ready') || text.startsWith('Model load failed:');
            }, null, { timeout: 30000 });
            const modelStatus = await page.textContent('#modelStatus');
            assert.match(modelStatus, /Frozen model ready/);
            const title = await page.textContent('h1');
            assert.equal(title.trim(), 'RoyaCheck Offline');
            assert.ok(await page.locator('#imageInput[type="file"][accept="image/*"]').count());
            const htmlText = (await page.locator('body').innerText()).toLowerCase();
            for (const phrase of [
              'visible rust',
              'no visible rust',
              'not sure',
              'not a diagnosis',
              'not treatment advice',
              'no rocole external readout',
              'only the human disposition becomes formal',
              'no raw image',
            ]) {
              assert.ok(htmlText.includes(phrase), `missing visible phrase: ${phrase}`);
            }
            const humanValue = await page.locator('#humanDisposition').evaluate(el => el.value);
            assert.equal(humanValue, '');
            const options = await page.locator('#humanDisposition option').evaluateAll(nodes => nodes.map(n => n.value));
            assert.deepEqual(options, ['', 'visible_rust', 'no_visible_rust', 'not_sure', 'request_review']);
            const runDisabled = await page.locator('#runButton').evaluate(el => el.disabled);
            assert.equal(runDisabled, true);
            assert.equal(requests.filter(r => r.method !== 'GET').length, 0);
            assert.equal(requests.filter(r => !r.url.startsWith('http://127.0.0.1:8765/')).length, 0);
            assert.ok(requests.some(r => r.url.endsWith('/app/vendor/onnxruntime-web/ort.wasm.min.mjs')));
            assert.ok(requests.some(r => r.url.endsWith('/app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs')));
            assert.ok(requests.some(r => r.url.endsWith('/app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm')));
            assert.ok(requests.some(r => r.url.endsWith('/app/assets/model/royacheck_a0_fp32.onnx')));
            await browser.close();
            console.log(JSON.stringify({
              app_shell_loads: true,
              onnxruntime_web_loads_locally: true,
              model_loads_in_browser: true,
              image_input_path_present: true,
              non_get_requests: 0,
              external_requests: 0,
              human_disposition_blank_by_default: true,
              public_outputs_limited: ['visible rust', 'no visible rust', 'not sure']
            }, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Write concise smoke evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/stages/08_mvp
          cat > docs/stages/08_mvp/STAGE_08_BROWSER_SMOKE_EVIDENCE.md <<'EOF'
          # Stage 8 — Browser Smoke Evidence

          **Stage:** 8 — MVP browser-local smoke evidence  
          **Branch:** `chatgpt/stage-08-mvp-build`  
          **Evidence execution:** GitHub Actions temporary local static server + headless Chromium  
          **Status:** PASS

          ## Static checks

          `npm test` passed against the Stage 8 branch state. The static smoke check locks the browser app contract for thresholds, class order, ImageNet normalization constants, ONNX input/output use, human-authority fields, no raw-image retention, public output labels, no remote HTTP shell dependencies, and offline core-asset declarations.

          ## Browser smoke observations

          The browser smoke check served `app/index.html` from a local static server and verified:

          - app shell loads;
          - ONNX Runtime Web loads from local repository assets;
          - the fixed A0 ONNX model loads in browser;
          - the committed ONNX asset SHA-256 remains `4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041`;
          - image upload/capture input is present;
          - no non-GET request occurred during default page load;
          - no external request occurred during default page load;
          - public outputs remain limited to `visible rust`, `no visible rust`, and `not sure`;
          - human disposition is blank by default;
          - `not diagnosis` / `not treatment advice` messaging is visible;
          - Stage 7C / Stage 7E-only evidence boundary is visible, including no RoCoLe external readout.

          ## Boundary maintained

          This smoke evidence did not perform deployment, RoCoLe inference, challenge-set inference, model change, threshold change, preprocessing change, raw dataset commit, video production, submission, treatment recommendation, claim expansion, or Stage 7 closure.

          ## Runtime asset repair

          The first smoke run exposed that `ort.all.min.js` expected an additional dynamic JSEP module. The final smoke-passing branch uses the narrower self-hosted WASM ES-module assets from `onnxruntime-web@1.30.0`: `ort.wasm.min.mjs`, `ort-wasm-simd-threaded.mjs`, and `ort-wasm-simd-threaded.wasm`.

          ## Temporary workflow handling

          The workflow used to generate this evidence was temporary and removed itself from the branch before committing this evidence file.
          EOF
          rm -f .github/workflows/stage8-smoke-evidence.yml
          git status --short

      - name: Commit smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app docs/stages/08_mvp tests/static-smoke.mjs .github/workflows/stage8-smoke-evidence.yml
          git commit -m "stage 8: add browser smoke evidence"
          git push origin HEAD:chatgpt/stage-08-mvp-build
