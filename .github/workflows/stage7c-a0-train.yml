name: Stage 7C A0 training

on:
  push:
    branches: [chatgpt/stage-07-pretraining-gates]
    paths: [.github/workflows/stage7c-a0-train.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a0-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          python -m pip install pandas pillow gdown
      - name: Download BRACOL archive
        run: |
          set -euo pipefail
          mkdir -p data stage7c_a0_evidence
          gdown 1ZMO9UnLK62SZYAdybDHRtarYDboQl_cT -O data/coffee-datasets.zip
          sha256sum data/coffee-datasets.zip | tee stage7c_a0_evidence/coffee_datasets_sha256.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('data/coffee-datasets.zip')
          expected='e6fc32d504ae33e667475dec4c4aef710aac65ad12f16a401c706445c46c9f89'
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          print('coffee_datasets_bytes',p.stat().st_size)
          print('coffee_datasets_sha256',actual)
          if actual != expected:
              raise SystemExit(f'BRACOL archive SHA mismatch: {actual}')
          PY
      - name: Train and validate A0 only
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, random, time, zipfile
          from pathlib import Path
          import numpy as np, pandas as pd, torch
          from PIL import Image
          from torch import nn
          from torch.utils.data import Dataset, DataLoader, TensorDataset
          from torchvision import transforms
          from torchvision.models import mobilenet_v3_small, MobileNet_V3_Small_Weights
          SEED=20261003
          random.seed(SEED); np.random.seed(SEED); torch.manual_seed(SEED); torch.set_num_threads(2)
          out=Path('stage7c_a0_evidence'); out.mkdir(exist_ok=True)
          z=zipfile.ZipFile('data/coffee-datasets.zip')
          split=json.loads(Path('docs/stages/07_technical_proof/manifests/bracol_stage7b_split_ids.json').read_text())
          train_ids=[int(x) for x in split['train']]; val_ids=[int(x) for x in split['validation']]
          df=pd.read_csv(z.open('coffee-datasets/leaf/dataset.csv'))
          rows={int(r.id):r for r in df.itertuples(index=False)}
          class_names=['healthy','rust_present','leaf_miner_no_rust','brown_leaf_spot_no_rust','cercospora_no_rust']
          def ci(i):
              r=rows[int(i)]
              if int(r.predominant_stress)==5: raise ValueError('excluded id used')
              if int(r.rust)==1: return 1
              ps=int(r.predominant_stress)
              return {0:0,1:2,3:3,4:4}[ps]
          def tg(i):
              c=ci(i); return 'R' if c==1 else ('H' if c==0 else 'O')
          y_train0=[ci(i) for i in train_ids]; y_val=[ci(i) for i in val_ids]; val_truth=[tg(i) for i in val_ids]
          weights=MobileNet_V3_Small_Weights.IMAGENET1K_V1; mean=weights.transforms().mean; std=weights.transforms().std
          eval_tf=transforms.Compose([transforms.Resize((224,224),interpolation=transforms.InterpolationMode.BILINEAR,antialias=True),transforms.ToTensor(),transforms.Normalize(mean,std)])
          aug_tf=transforms.Compose([transforms.RandomHorizontalFlip(.5),transforms.RandomVerticalFlip(.5),transforms.RandomRotation(15,interpolation=transforms.InterpolationMode.BILINEAR,fill=255),transforms.ColorJitter(brightness=.10,contrast=.10),transforms.Resize((224,224),interpolation=transforms.InterpolationMode.BILINEAR,antialias=True),transforms.ToTensor(),transforms.Normalize(mean,std)])
          class ZDS(Dataset):
              def __init__(self, ids, labels, tf): self.ids=ids; self.labels=labels; self.tf=tf
              def __len__(self): return len(self.ids)
              def __getitem__(self, idx):
                  i=self.ids[idx]
                  with z.open(f'coffee-datasets/leaf/images/{i}.jpg') as f: im=Image.open(io.BytesIO(f.read())).convert('RGB')
                  if im.width<224 or im.height<224: raise ValueError(f'ineligible {i} {im.size}')
                  return self.tf(im), int(self.labels[idx]), int(i)
          class FE(nn.Module):
              def __init__(self, base): super().__init__(); self.features=base.features; self.avgpool=base.avgpool
              def forward(self,x): return torch.flatten(self.avgpool(self.features(x)),1)
          base=mobilenet_v3_small(weights=weights); fe=FE(base).eval()
          for p in fe.parameters(): p.requires_grad_(False)
          def extract(ids, labels, tf):
              loader=DataLoader(ZDS(ids,labels,tf),batch_size=32,shuffle=False,num_workers=0)
              fs=[]; ys=[]; got=[]
              with torch.no_grad():
                  for xb,yb,ib in loader:
                      fs.append(fe(xb).cpu()); ys.append(yb.clone()); got += [int(x) for x in ib]
              return torch.cat(fs), torch.cat(ys), got
          t0=time.time(); feats=[]; labs=[]
          for k,tf in enumerate([eval_tf, aug_tf, aug_tf]):
              random.seed(SEED+k); np.random.seed(SEED+k); torch.manual_seed(SEED+k)
              f,l,_=extract(train_ids,y_train0,tf); feats.append(f); labs.append(l)
          Xtr=torch.cat(feats); ytr=torch.cat(labs); Xv,yv,vids=extract(val_ids,y_val,eval_tf); assert vids==val_ids
          feature_seconds=time.time()-t0
          counts=np.bincount(y_train0,minlength=5); cw=(len(y_train0)/(5*np.maximum(counts,1))).astype('float32')
          head=nn.Linear(576,5); opt=torch.optim.AdamW(head.parameters(),lr=1e-3,weight_decay=1e-4); loss_fn=nn.CrossEntropyLoss(weight=torch.tensor(cw))
          loader=DataLoader(TensorDataset(Xtr,ytr),batch_size=32,shuffle=True,generator=torch.Generator().manual_seed(SEED))
          best=None; hist=[]
          for ep in range(1,31):
              head.train(); losses=[]
              for xb,yb in loader:
                  opt.zero_grad(); loss=loss_fn(head(xb),yb); loss.backward(); opt.step(); losses.append(float(loss.item()))
              head.eval()
              with torch.no_grad(): vl=float(loss_fn(head(Xv),yv).item())
              rec={'epoch':ep,'train_loss':float(np.mean(losses)),'val_loss':vl}; hist.append(rec); print(json.dumps(rec))
              if best is None or vl<best['val_loss']: best={'epoch':ep,'val_loss':vl,'state':{k:v.detach().clone() for k,v in head.state_dict().items()}}
          head.load_state_dict(best['state']); head.eval()
          with torch.no_grad(): logits=head(Xv).numpy(); probs=torch.softmax(torch.tensor(logits),dim=1).numpy()
          def route_counts(Tr,Th):
              cnt={k:0 for k in ['R_to_VR','R_to_NVR','R_to_NS','H_to_VR','H_to_NVR','H_to_NS','O_to_VR','O_to_NVR','O_to_NS']}; routes=[]
              for truth,p in zip(val_truth,probs):
                  pred=int(np.argmax(p)); route='NS'
                  if pred==1 and p[1]>=Tr: route='VR'
                  elif pred==0 and p[0]>=Th: route='NVR'
                  cnt[f'{truth}_to_{route}']+=1; routes.append(route)
              Rc=cnt['R_to_VR']+cnt['R_to_NVR']; Hc=cnt['H_to_VR']+cnt['H_to_NVR']; target=Rc+Hc
              ok=(target>=68 and Rc>=47 and Hc>=21 and 100*(cnt['R_to_VR']+cnt['H_to_NVR'])>=85*target and 100*cnt['R_to_VR']>=90*Rc and 100*cnt['H_to_NVR']>=80*Hc and cnt['R_to_NVR']<=4 and cnt['O_to_NVR']<=11)
              return {**cnt,'target_confident':target,'R_confident':Rc,'H_confident':Hc,'O_confident':cnt['O_to_VR']+cnt['O_to_NVR'],'selective_accuracy_num':cnt['R_to_VR']+cnt['H_to_NVR'],'selective_accuracy_den':target,'accepted_rust_recall_num':cnt['R_to_VR'],'accepted_rust_recall_den':Rc,'accepted_healthy_specificity_num':cnt['H_to_NVR'],'accepted_healthy_specificity_den':Hc,'feasible':bool(ok)}, routes
          ledger=[]; feasible=[]
          for a in range(50,96):
              for b in range(50,96):
                  Tr=round(a/100,2); Th=round(b/100,2); m,_=route_counts(Tr,Th); row={'T_rust':Tr,'T_healthy':Th,**m}; ledger.append(row)
                  if m['feasible']: feasible.append(row)
          if feasible:
              sel=dict(sorted(feasible,key=lambda r:(r['R_to_NVR'],-r['target_confident'],-(r['accepted_rust_recall_num']/r['accepted_rust_recall_den']),-r['T_healthy'],-r['T_rust']))[0]); sel['gate_pass']=True
          else:
              sel=dict(sorted(ledger,key=lambda r:(r['R_to_NVR'],-r['target_confident'],-r['T_healthy'],-r['T_rust']))[0]); sel['gate_pass']=False
          sm,routes=route_counts(sel['T_rust'],sel['T_healthy']); sel.update(sm)
          with open(out/'stage7c_a0_threshold_ledger.csv','w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(ledger[0].keys())); w.writeheader(); w.writerows(ledger)
          with open(out/'stage7c_a0_validation_routes.csv','w',newline='') as f:
              cols=['image_id','truth_group','true_class','pred_class','route','p_healthy','p_rust_present','p_leaf_miner_no_rust','p_brown_leaf_spot_no_rust','p_cercospora_no_rust']; w=csv.DictWriter(f,fieldnames=cols); w.writeheader()
              for i,t,y,p,r in zip(val_ids,val_truth,y_val,probs,routes): w.writerow({'image_id':i,'truth_group':t,'true_class':class_names[y],'pred_class':class_names[int(np.argmax(p))],'route':r,'p_healthy':float(p[0]),'p_rust_present':float(p[1]),'p_leaf_miner_no_rust':float(p[2]),'p_brown_leaf_spot_no_rust':float(p[3]),'p_cercospora_no_rust':float(p[4])})
          torch.save({'head_state_dict':best['state'],'class_names':class_names,'seed':SEED,'best_epoch':best['epoch']}, out/'stage7c_a0_head_state.pt')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          summary={'stage':'7C_A0_validation','training_performed':True,'model':'A0 frozen MobileNetV3-Small + Linear(576,5)','seed':SEED,'optimizer':'AdamW','lr':1e-3,'weight_decay':1e-4,'batch_size':32,'loss':'class-weighted cross-entropy','max_epochs':30,'best_epoch':best['epoch'],'best_val_loss':best['val_loss'],'feature_seconds':feature_seconds,'train_original_records':len(train_ids),'train_feature_rows':int(len(Xtr)),'validation_records':len(val_ids),'internal_test_used':False,'rocole_used':False,'challenge_used':False,'class_names':class_names,'train_class_counts':{class_names[i]:int(counts[i]) for i in range(5)},'class_weights':{class_names[i]:float(cw[i]) for i in range(5)},'preprocessing':'RGB decode; require >=224px; full-frame direct bilinear resize to 224x224; ImageNet normalization; no center crop','training_augmentation':'two additional feature passes using allowed flips, ±15° rotation, mild brightness/contrast; no synthetic lesions','threshold_grid':'0.50..0.95 inclusive step 0.01','feasible_threshold_pairs':len(feasible),'selected':sel,'gate_pass':bool(sel['gate_pass']),'history':hist,'artifacts':{'head_state_sha256':sha(out/'stage7c_a0_head_state.pt')}}
          (out/'stage7c_a0_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          with open(out/'stage7c_a0_training_history.csv','w',newline='') as f: w=csv.DictWriter(f,fieldnames=['epoch','train_loss','val_loss']); w.writeheader(); w.writerows(hist)
          print('STAGE7C_A0_SUMMARY_BEGIN'); print(json.dumps(summary,indent=2,sort_keys=True)); print('STAGE7C_A0_SUMMARY_END')
          PY
      - name: Upload A0 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage7c-a0-validation-evidence
          path: stage7c_a0_evidence
          if-no-files-found: error
          retention-days: 3
