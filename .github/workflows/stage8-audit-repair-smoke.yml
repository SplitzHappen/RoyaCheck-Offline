name: Stage 8 audit repair smoke

on:
  push:
    branches:
      - chatgpt/stage-08-mvp-build
  workflow_dispatch:

jobs:
  smoke:
    if: github.ref == 'refs/heads/chatgpt/stage-08-mvp-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow onnxruntime
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Static and preprocessing reference checks
        run: npm test

      - name: Generate Python reference routes
        run: |
          mkdir -p tmp/stage8-e2e
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import onnxruntime as ort
          from PIL import Image

          MODEL_SHA256 = "4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041"
          MEAN = np.array([0.485, 0.456, 0.406], dtype=np.float32)[:, None, None]
          STD = np.array([0.229, 0.224, 0.225], dtype=np.float32)[:, None, None]
          CLASS_NAMES = ["healthy", "rust_present", "leaf_miner_no_rust", "brown_leaf_spot_no_rust", "cercospora_no_rust"]
          T_RUST = 0.50
          T_HEALTHY = 0.70

          def make_fixture(name, width, height):
              y, x = np.mgrid[0:height, 0:width]
              arr = np.zeros((height, width, 3), dtype=np.uint8)
              if name == "gradient_leaf":
                  arr[..., 0] = (x * 7 + y * 3) % 256
                  arr[..., 1] = (x * 2 + y * 5 + 40) % 256
                  arr[..., 2] = (x * 11 + y * 13 + 80) % 256
              elif name == "stripe_spots":
                  arr[..., 0] = ((x // 7) * 53 + (y // 11) * 19) % 256
                  arr[..., 1] = ((x // 5) * 31 + y * 2 + 60) % 256
                  arr[..., 2] = ((y // 3) * 47 + x + 10) % 256
              else:
                  raise ValueError(name)
              return arr

          def route(probs):
              top = int(np.argmax(probs))
              if top == 1 and probs[1] >= T_RUST:
                  return "visible_rust"
              if top == 0 and probs[0] >= T_HEALTHY:
                  return "no_visible_rust"
              return "not_sure"

          session = ort.InferenceSession("app/assets/model/royacheck_a0_fp32.onnx", providers=["CPUExecutionProvider"])
          fixtures = []
          for name, width, height in [("gradient_leaf", 448, 224), ("stripe_spots", 512, 384)]:
              arr = make_fixture(name, width, height)
              png_path = Path("tmp/stage8-e2e") / f"{name}.png"
              Image.fromarray(arr).save(png_path)
              resized = np.asarray(Image.fromarray(arr).resize((224, 224), Image.Resampling.BILINEAR)).astype(np.float32) / 255.0
              tensor = ((resized.transpose(2, 0, 1) - MEAN) / STD)[None, :, :, :].astype(np.float32)
              logits = session.run(["logits"], {"input": tensor})[0][0]
              exp = np.exp(logits - logits.max())
              probs = exp / exp.sum()
              fixtures.append({
                  "name": name,
                  "path": str(png_path),
                  "expected_route": route(probs),
                  "probabilities": {CLASS_NAMES[i]: round(float(probs[i]), 6) for i in range(len(CLASS_NAMES))},
              })

          out = {"model_sha256": MODEL_SHA256, "fixtures": fixtures}
          Path("tmp/stage8-e2e/expected-routes.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY

      - name: Browser image-to-record smoke
        run: |
          python -m http.server 4173 --bind 127.0.0.1 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          ROYA_BASE_URL=http://127.0.0.1:4173/app/ node tests/browser-e2e.mjs tmp/stage8-e2e/expected-routes.json

      - name: Evidence summary
        run: |
          {
            echo "## Stage 8 audit-repair smoke"
            echo "- commit: $GITHUB_SHA"
            echo "- npm test: PASS"
            echo "- browser image-to-record smoke: PASS"
            echo "- reference routes:"
            cat tmp/stage8-e2e/expected-routes.json
          } >> "$GITHUB_STEP_SUMMARY"
