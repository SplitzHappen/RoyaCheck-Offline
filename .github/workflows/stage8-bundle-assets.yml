name: Stage 8 bundle fixed model/runtime assets

on:
  push:
    branches: [chatgpt/stage-08-mvp-build]
    paths: [.github/workflows/stage8-bundle-assets.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  bundle-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage-08-mvp-build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download fixed Stage 7D A0 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage7d-a0-export-parity
          run-id: 37172702270
          path: /tmp/stage7d
          github-token: ${{ github.token }}

      - name: Install and copy bounded ONNX Runtime Web assets
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$(find /tmp/stage7d -type f -name royacheck_a0_fp32.onnx | head -n 1)"
          test -n "$MODEL"
          mkdir -p app/assets/model app/vendor/onnxruntime-web
          cp "$MODEL" app/assets/model/royacheck_a0_fp32.onnx

          mkdir -p /tmp/ort
          cd /tmp/ort
          npm init -y >/dev/null
          npm install --no-audit --no-fund onnxruntime-web@1.30.0 playwright-core@1.55.0
          cp node_modules/onnxruntime-web/dist/ort.wasm.min.mjs "$GITHUB_WORKSPACE/app/vendor/onnxruntime-web/ort.wasm.min.mjs"
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs "$GITHUB_WORKSPACE/app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs"
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm "$GITHUB_WORKSPACE/app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm"
          rm -f "$GITHUB_WORKSPACE/app/vendor/onnxruntime-web/ort.all.min.js"

      - name: Verify locked hashes and build asset manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041  app/assets/model/royacheck_a0_fp32.onnx" | sha256sum -c -
          test "$(node -p "require('/tmp/ort/node_modules/onnxruntime-web/package.json').version")" = "1.30.0"
          sha256sum app/vendor/onnxruntime-web/ort.wasm.min.mjs
          sha256sum app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs
          sha256sum app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          files = [
              "app/index.html",
              "app/styles.css",
              "app/app.js",
              "app/manifest.webmanifest",
              "app/sw.js",
              "app/assets/icon.svg",
              "app/assets/model/royacheck_a0_fp32.onnx",
              "app/vendor/onnxruntime-web/ort.wasm.min.mjs",
              "app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs",
              "app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm",
          ]
          rows = []
          total = 0
          for name in files:
              p = Path(name)
              data = p.read_bytes()
              size = len(data)
              total += size
              rows.append({"path": name, "bytes": size, "sha256": hashlib.sha256(data).hexdigest()})
          manifest = {
              "stage": "8_mvp_asset_bundle",
              "source_stage7d_artifact_id": 11292181113,
              "source_stage7d_artifact_name": "stage7d-a0-export-parity",
              "onnx_expected_sha256": "4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041",
              "onnxruntime_web_version": "1.30.0",
              "core_budget_bytes": 30000000,
              "cached_file_bytes": total,
              "core_budget_pass": total <= 30000000,
              "files": rows,
              "boundaries": {
                  "deployment": False,
                  "rocole_inference": False,
                  "challenge_inference": False,
                  "model_change": False,
                  "threshold_change": False,
                  "preprocessing_change": False,
              },
          }
          if not manifest["core_budget_pass"]:
              raise SystemExit(f"core asset budget failed: {total}")
          out = Path("docs/stages/08_mvp/STAGE_08_ASSET_MANIFEST.json")
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Headless browser ONNX Runtime Web parity smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          cat > app/.runtime-smoke.html <<'HTML'
          <!doctype html>
          <html><body><pre id="result">PENDING</pre>
          <script type="module">
          import * as ort from "./vendor/onnxruntime-web/ort.wasm.min.mjs";
          (async () => {
            try {
              ort.env.wasm.numThreads = 1;
              ort.env.wasm.proxy = false;
              const session = await ort.InferenceSession.create("./assets/model/royacheck_a0_fp32.onnx", {
                executionProviders: ["wasm"],
                graphOptimizationLevel: "all"
              });
              const x = new Float32Array(1 * 3 * 224 * 224);
              const tensor = new ort.Tensor("float32", x, [1, 3, 224, 224]);
              const out = await session.run({ input: tensor });
              const logits = Array.from(out.logits.data);
              const expected = [-2.0775744915008545, 0.43236833810806274, 1.0753188133239746, -2.017965793609619, -2.5632123947143555];
              const maxAbs = Math.max(...logits.map((v, i) => Math.abs(v - expected[i])));
              document.getElementById("result").textContent = (maxAbs <= 1e-4 ? "PASS" : "FAIL") + "|" + maxAbs + "|" + JSON.stringify(logits);
            } catch (e) {
              document.getElementById("result").textContent = "ERROR|" + (e && e.stack ? e.stack : String(e));
            }
          })();
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/royacheck-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f "$GITHUB_WORKSPACE/app/.runtime-smoke.html"' EXIT
          sleep 1
          cd /tmp/ort
          CHROME_PATH="$CHROME" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node - <<'JS'
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ["--no-sandbox", "--disable-gpu"]
            });
            const page = await browser.newPage();
            page.on("console", msg => console.log("browser_console", msg.type(), msg.text()));
            page.on("pageerror", err => console.error("browser_pageerror", err.stack || String(err)));
            await page.goto("http://127.0.0.1:8765/app/.runtime-smoke.html", { waitUntil: "load", timeout: 30000 });
            await page.waitForFunction(() => {
              const v = document.getElementById("result")?.textContent || "";
              return v.startsWith("PASS|") || v.startsWith("FAIL|") || v.startsWith("ERROR|");
            }, null, { timeout: 30000 });
            const result = await page.locator("#result").textContent();
            console.log("browser_parity_result", result);
            await browser.close();
            if (!result.startsWith("PASS|")) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          cd "$GITHUB_WORKSPACE"

      - name: Run static smoke checks
        run: npm test

      - name: Commit verified binary/runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/model/royacheck_a0_fp32.onnx
          git add -A app/vendor/onnxruntime-web
          git add docs/stages/08_mvp/STAGE_08_ASSET_MANIFEST.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Verified assets already match branch; no asset commit required."
          else
            git commit -m "stage 8: bundle fixed model and runtime assets"
            git push origin HEAD:chatgpt/stage-08-mvp-build
          fi
