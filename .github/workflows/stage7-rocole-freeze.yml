name: Stage 7 RoCoLe metadata freeze

on:
  push:
    branches:
      - chatgpt/stage-07-pretraining-gates
    paths:
      - .github/workflows/stage7-rocole-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocole-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl requests

      - name: Freeze RoCoLe public API metadata only
        run: |
          set -euo pipefail
          mkdir -p rocole_freeze
          python - <<'PY'
          import csv, json, hashlib, re, sys
          from pathlib import Path
          import requests
          import pandas as pd

          out=Path('rocole_freeze')
          headers={'Accept':'application/vnd.mendeley-public-dataset.1+json'}
          base='https://api.data.mendeley.com/datasets'
          did='c5yvn32dzg'
          version=2
          folders={
            'Annotations':'201c7329-268c-48fb-a452-d9b435817774',
            'Photos':'1ca51fea-39e6-483f-a3f4-7e54cf3b4fd8',
          }
          session=requests.Session()
          session.headers.update(headers)
          def get_json(url):
            r=session.get(url,timeout=60)
            print('GET',r.status_code,url)
            print((r.text or '')[:500])
            r.raise_for_status()
            return r.json()
          # Basic metadata endpoints.
          versions=get_json(f'{base}/{did}/versions')
          zip_meta=get_json(f'{base}/{did}/zip?version={version}')
          folder_meta=get_json(f'{base}/{did}/folders?version={version}')
          (out/'rocole_versions.json').write_text(json.dumps(versions,indent=2,sort_keys=True))
          (out/'rocole_zip.json').write_text(json.dumps(zip_meta,indent=2,sort_keys=True))
          (out/'rocole_folders.json').write_text(json.dumps(folder_meta,indent=2,sort_keys=True))

          all_files=[]
          for fname,fid in folders.items():
            start=0
            limit=500
            while True:
              url=f'{base}/publics/{did}/files?version={version}&folder_id={fid}&%24start={start}&%24limit={limit}'
              batch=get_json(url)
              if not batch:
                break
              for rec in batch:
                rec['_folder_name']=fname
                all_files.append(rec)
              if len(batch)<limit:
                break
              start += limit
          (out/'rocole_public_file_metadata.json').write_text(json.dumps(all_files,indent=2,sort_keys=True))

          # Identifiers: metadata only, no image content opened.
          image_recs=[]
          annotation_recs=[]
          for rec in all_files:
            fn=rec.get('filename') or ''
            folder=rec.get('_folder_name')
            size=rec.get('size') or rec.get('content_details',{}).get('size')
            sha=rec.get('content_details',{}).get('sha256_hash')
            fid=rec.get('id')
            if folder=='Photos' and fn.lower().endswith(('.jpg','.jpeg')):
              image_recs.append({'image_id':Path(fn).stem,'filename':fn,'file_id':fid,'file_size':size,'source_sha256':sha})
            elif folder=='Annotations':
              annotation_recs.append({'filename':fn,'file_id':fid,'file_size':size,'source_sha256':sha,'download_url':rec.get('content_details',{}).get('download_url')})
          with (out/'rocole_image_identifiers.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['image_id','filename','file_id','file_size','source_sha256'])
            w.writeheader(); w.writerows(sorted(image_recs,key=lambda r:r['filename']))
          with (out/'rocole_annotation_files.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['filename','file_id','file_size','source_sha256','download_url'])
            w.writeheader(); w.writerows(sorted(annotation_recs,key=lambda r:r['filename']))

          # Download annotation files only, not photos.
          metadata_summary=[]
          label_tables=[]
          for rec in annotation_recs:
            url=rec['download_url']
            if not url:
              continue
            r=session.get(url,timeout=120,allow_redirects=True)
            print('ANNOT',r.status_code,rec['filename'],len(r.content))
            r.raise_for_status()
            safe=re.sub(r'[^A-Za-z0-9_.-]+','_',rec['filename'])
            p=out/('annotation_'+safe)
            p.write_bytes(r.content)
            item={'filename':rec['filename'],'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest(),'saved_as':p.name}
            try:
              suffix=Path(rec['filename']).suffix.lower()
              if suffix=='.csv':
                df=pd.read_csv(p)
                item.update({'rows':len(df),'columns':list(map(str,df.columns))})
                if len(df)<=5000: label_tables.append((rec['filename'],df))
              elif suffix in {'.xlsx','.xls'}:
                xl=pd.ExcelFile(p)
                item['sheets']=xl.sheet_names
                item['sheet_shapes']={}
                for sh in xl.sheet_names:
                  df=pd.read_excel(p,sheet_name=sh)
                  item['sheet_shapes'][sh]={'rows':len(df),'columns':list(map(str,df.columns))}
                  if len(df)<=5000: label_tables.append((rec['filename']+'::'+sh,df))
              elif suffix=='.json':
                obj=json.loads(p.read_text(errors='replace'))
                item['json_type']=type(obj).__name__
                if isinstance(obj,dict): item['json_keys']=list(obj.keys())[:50]
                if isinstance(obj,list): item['json_len']=len(obj)
            except Exception as e:
              item['inspect_error']=type(e).__name__+': '+str(e)
            metadata_summary.append(item)
          (out/'rocole_annotation_metadata_summary.json').write_text(json.dumps(metadata_summary,indent=2,sort_keys=True))

          # Retain the raw 1560-row label table if one exists, no model use.
          rows1560=[]
          for source,df in label_tables:
            if len(df)==1560:
              rows1560.append(source)
              p=out/'rocole_external_metadata_map.csv'
              with p.open('w',newline='') as f:
                fieldnames=['metadata_source']+list(map(str,df.columns))
                w=csv.DictWriter(f,fieldnames=fieldnames)
                w.writeheader()
                for _,row in df.iterrows():
                  rec={'metadata_source':source}
                  for c in df.columns:
                    val=row[c]
                    rec[str(c)]='' if pd.isna(val) else str(val)
                  w.writerow(rec)
              break
          summary={
            'stage':'7B_RoCoLe_external_freeze',
            'doi':'10.17632/c5yvn32dzg.2',
            'version':2,
            'folders':folders,
            'zip_meta':zip_meta,
            'photo_identifier_count':len(image_recs),
            'annotation_file_count':len(annotation_recs),
            'label_tables_1560':rows1560,
            'stage4_mapping':{
              'healthy':'H',
              'rust_level_1':'R',
              'rust_level_2':'R',
              'rust_level_3':'R',
              'rust_level_4':'R',
              'red_spider_mite':'O-unseen'
            },
            'known_conflict_policy':'Exclude and disclose explicit state/classification conflicts if confirmed before external readout.',
            'quarantine':'RoCoLe external-transfer one-shot only; no model design/tuning/threshold/fallback use.',
            'model_inference_performed':False,
            'performance_outcome_produced':False
          }
          (out/'rocole_freeze_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload RoCoLe freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage7-rocole-freeze
          path: rocole_freeze
          if-no-files-found: error
          retention-days: 3
