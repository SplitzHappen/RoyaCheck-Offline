name: Stage 7D A0 export parity

on:
  push:
    branches: [chatgpt/stage-07-pretraining-gates]
    paths: [.github/workflows/stage7d-a0-export-parity.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  a0-export-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download Stage 7C A0 evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: stage7c-a0-validation-evidence
          run-id: 37171911439
          path: stage7c_a0_evidence
          github-token: ${{ github.token }}
      - name: Install export and parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          python -m pip install numpy onnx==1.23.1 onnxruntime==1.30.0
          npm init -y >/dev/null 2>&1
          npm install onnxruntime-web@1.30.0
      - name: Export trained A0 ONNX and verify parity
        run: |
          set -euo pipefail
          mkdir -p stage7d_a0_evidence stage7d_a0_model
          python - <<'PY'
          import hashlib, json, os, platform, sys, time
          from pathlib import Path
          import numpy as np
          import torch
          from torch import nn
          from torchvision.models import mobilenet_v3_small, MobileNet_V3_Small_Weights
          import onnx
          import onnxruntime as ort

          SEED = 20261003
          torch.manual_seed(SEED)
          np.random.seed(SEED)
          torch.set_num_threads(2)

          evidence = Path('stage7d_a0_evidence')
          evidence.mkdir(exist_ok=True)
          model_dir = Path('stage7d_a0_model')
          model_dir.mkdir(exist_ok=True)
          src = Path('stage7c_a0_evidence')
          head_path = src / 'stage7c_a0_head_state.pt'
          src_summary_path = src / 'stage7c_a0_summary.json'
          if not head_path.exists():
              raise SystemExit('missing Stage 7C head state')
          if not src_summary_path.exists():
              raise SystemExit('missing Stage 7C summary')

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          head_sha = sha256(head_path)
          expected_head_sha = '5c366089a8ee91d3a7752b0fae505df3f96463c32417861fbf28482f0b919a44'
          if head_sha != expected_head_sha:
              raise SystemExit(f'head-state SHA mismatch: {head_sha}')
          src_summary = json.loads(src_summary_path.read_text())
          if not bool(src_summary.get('gate_pass')):
              raise SystemExit('Stage 7C source summary does not report gate_pass=true')

          class FeatureExtractor(nn.Module):
              def __init__(self, base):
                  super().__init__()
                  self.features = base.features
                  self.avgpool = base.avgpool
              def forward(self, x):
                  return torch.flatten(self.avgpool(self.features(x)), 1)

          class A0(nn.Module):
              def __init__(self, fe, head):
                  super().__init__()
                  self.fe = fe
                  self.head = head
              def forward(self, x):
                  return self.head(self.fe(x))

          weights = MobileNet_V3_Small_Weights.IMAGENET1K_V1
          base = mobilenet_v3_small(weights=weights)
          fe = FeatureExtractor(base).eval()
          for p in fe.parameters():
              p.requires_grad_(False)
          head = nn.Linear(576, 5)
          checkpoint = torch.load(head_path, map_location='cpu')
          head.load_state_dict(checkpoint['head_state_dict'])
          model = A0(fe, head).eval()

          onnx_path = model_dir / 'royacheck_a0_fp32.onnx'
          dummy = torch.zeros(1, 3, 224, 224, dtype=torch.float32)
          torch.onnx.export(
              model,
              dummy,
              onnx_path.as_posix(),
              input_names=['input'],
              output_names=['logits'],
              opset_version=18,
              dynamo=False,
          )
          onnx_model = onnx.load(onnx_path.as_posix())
          onnx.checker.check_model(onnx_model)

          sess = ort.InferenceSession(onnx_path.as_posix(), providers=['CPUExecutionProvider'])
          parity_inputs = []
          parity_inputs.append(('zeros', torch.zeros(1, 3, 224, 224, dtype=torch.float32)))
          parity_inputs.append(('half', torch.full((1, 3, 224, 224), 0.5, dtype=torch.float32)))
          gen = torch.Generator().manual_seed(SEED)
          parity_inputs.append(('randn_seeded', torch.randn((1, 3, 224, 224), generator=gen, dtype=torch.float32)))
          ramp = torch.linspace(-1.0, 1.0, 3 * 224 * 224, dtype=torch.float32).reshape(1, 3, 224, 224)
          parity_inputs.append(('ramp', ramp))

          parity = []
          max_abs_all = 0.0
          max_rel_all = 0.0
          for name, x in parity_inputs:
              with torch.no_grad():
                  pt = model(x).detach().cpu().numpy()
              oo = sess.run(None, {'input': x.numpy()})[0]
              abs_diff = np.abs(pt - oo)
              max_abs = float(abs_diff.max())
              denom = np.maximum(np.abs(pt), np.abs(oo))
              rel = abs_diff / np.maximum(denom, 1e-8)
              max_rel = float(rel.max())
              max_abs_all = max(max_abs_all, max_abs)
              max_rel_all = max(max_rel_all, max_rel)
              parity.append({
                  'input': name,
                  'max_abs_diff': max_abs,
                  'max_rel_diff': max_rel,
                  'pytorch_logits': pt.flatten().astype(float).tolist(),
                  'onnx_logits': oo.flatten().astype(float).tolist(),
              })
          parity_pass = max_abs_all <= 1e-4 and max_rel_all <= 1e-4
          if not parity_pass:
              raise SystemExit(f'parity failed: max_abs={max_abs_all} max_rel={max_rel_all}')

          dist = Path('node_modules/onnxruntime-web/dist')
          primary_runtime = [dist / 'ort.min.js', dist / 'ort-wasm-simd.wasm']
          missing = [p.as_posix() for p in primary_runtime if not p.exists()]
          if missing:
              raise SystemExit(f'missing ORT Web primary runtime assets: {missing}')
          model_bytes = onnx_path.stat().st_size
          primary_runtime_bytes = sum(p.stat().st_size for p in primary_runtime)
          current_core_bytes = model_bytes + primary_runtime_bytes
          all_dist_files = sorted([p for p in dist.glob('*') if p.is_file()])
          dist_manifest = [{'path': p.as_posix(), 'bytes': p.stat().st_size, 'sha256': sha256(p)} for p in all_dist_files]

          summary = {
              'stage': '7D_A0_artifact_export_parity',
              'source_stage7c_run_id': 37171911439,
              'source_stage7c_artifact_id': 11291109525,
              'source_head_state_sha256': head_sha,
              'model': 'A0 frozen MobileNetV3-Small + Linear(576,5)',
              'pretrained_backbone': {
                  'torchvision_weights': 'MobileNet_V3_Small_Weights.IMAGENET1K_V1',
                  'expected_url': 'https://download.pytorch.org/models/mobilenet_v3_small-047dcff4.pth',
                  'expected_sha256': '047dcff4addef86ea5bc2eff13c9614dc11f47ab1160d0a71a25e7db994f4e1f',
              },
              'export': {
                  'opset_version': 18,
                  'input_name': 'input',
                  'output_name': 'logits',
                  'onnx_file': onnx_path.name,
                  'onnx_bytes': model_bytes,
                  'onnx_sha256': sha256(onnx_path),
                  'onnx_checker_pass': True,
              },
              'parity': {
                  'providers': sess.get_providers(),
                  'inputs': parity,
                  'max_abs_diff_all': max_abs_all,
                  'max_rel_diff_all': max_rel_all,
                  'atol': 1e-4,
                  'rtol': 1e-4,
                  'pass': parity_pass,
                  'protected_data_used': False,
                  'validation_partition_used': False,
              },
              'budget': {
                  'model_budget_bytes': 12_000_000,
                  'model_budget_pass': model_bytes <= 12_000_000,
                  'core_budget_bytes': 30_000_000,
                  'primary_runtime_files': [p.as_posix() for p in primary_runtime],
                  'primary_runtime_bytes': primary_runtime_bytes,
                  'current_core_bytes_model_plus_primary_runtime': current_core_bytes,
                  'current_core_budget_pass_before_final_app_shell': current_core_bytes <= 30_000_000,
                  'note': 'Final Stage 8 app shell must remeasure total cached assets after UI/service-worker implementation.',
              },
              'packages': {
                  'python': sys.version,
                  'platform': platform.platform(),
                  'torch': torch.__version__,
                  'torchvision': __import__('torchvision').__version__,
                  'onnx': onnx.__version__,
                  'onnxruntime': ort.__version__,
                  'onnxruntime_web_npm': '1.30.0',
              },
              'ort_web_dist_manifest': dist_manifest,
              'boundaries': {
                  'a1_training': False,
                  'internal_test_inference': False,
                  'rocole_inference': False,
                  'challenge_inference': False,
                  'deployment': False,
                  'submission': False,
              },
          }
          if not summary['budget']['model_budget_pass']:
              raise SystemExit('model budget failed')
          if not summary['budget']['current_core_budget_pass_before_final_app_shell']:
              raise SystemExit('current core budget failed')
          (evidence / 'stage7d_a0_export_parity_summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print('STAGE7D_A0_EXPORT_PARITY_BEGIN')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('STAGE7D_A0_EXPORT_PARITY_END')
          PY
      - name: Upload Stage 7D A0 model and evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage7d-a0-export-parity
          path: |
            stage7d_a0_evidence
            stage7d_a0_model
          if-no-files-found: error
          retention-days: 3
