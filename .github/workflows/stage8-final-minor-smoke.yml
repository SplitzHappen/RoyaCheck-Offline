name: Stage 8 final minor smoke

on:
  push:
    branches:
      - chatgpt/stage-08-mvp-build

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow onnxruntime
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Static and preprocessing reference checks
        run: npm test
      - name: Generate route-variety Python reference routes
        run: |
          mkdir -p tmp/stage8-e2e
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import onnxruntime as ort
          from PIL import Image, ImageDraw, ImageFilter

          MODEL_SHA256 = "4037c09663190b7caed0773e525e5da39bd05286992612537991358b7acfd041"
          MEAN = np.array([0.485, 0.456, 0.406], dtype=np.float32)[:, None, None]
          STD = np.array([0.229, 0.224, 0.225], dtype=np.float32)[:, None, None]
          CLASS_NAMES = ["healthy", "rust_present", "leaf_miner_no_rust", "brown_leaf_spot_no_rust", "cercospora_no_rust"]
          T_RUST = 0.50
          T_HEALTHY = 0.70
          OUT = Path("tmp/stage8-e2e")
          OUT.mkdir(parents=True, exist_ok=True)

          def route(probs):
              top = int(np.argmax(probs))
              if top == 1 and probs[1] >= T_RUST:
                  return "visible_rust"
              if top == 0 and probs[0] >= T_HEALTHY:
                  return "no_visible_rust"
              return "not_sure"

          def infer(session, arr):
              resized = np.asarray(Image.fromarray(arr).resize((224, 224), Image.Resampling.BILINEAR)).astype(np.float32) / 255.0
              tensor = ((resized.transpose(2, 0, 1) - MEAN) / STD)[None, :, :, :].astype(np.float32)
              logits = session.run(["logits"], {"input": tensor})[0][0]
              exp = np.exp(logits - logits.max())
              probs = exp / exp.sum()
              return route(probs), probs

          def gradient_leaf(width=448, height=224):
              y, x = np.mgrid[0:height, 0:width]
              arr = np.zeros((height, width, 3), dtype=np.uint8)
              arr[..., 0] = (x * 7 + y * 3) % 256
              arr[..., 1] = (x * 2 + y * 5 + 40) % 256
              arr[..., 2] = (x * 11 + y * 13 + 80) % 256
              return arr

          def rust_spots_leaf(width=2048, height=1024, radius=12, spacing=70):
              y, x = np.mgrid[0:height, 0:width]
              arr = np.zeros((height, width, 3), dtype=np.uint8)
              arr[..., 0] = 38 + ((x // 31 + y // 29) % 24)
              arr[..., 1] = 104 + ((x // 17 + y // 23) % 76)
              arr[..., 2] = 34 + ((x // 41 + y // 19) % 30)
              mask = ((x - width / 2) / (width * 0.44)) ** 2 + ((y - height / 2) / (height * 0.36)) ** 2 <= 1
              arr[~mask] = [18, 35, 24]
              for cy in range(160, height - 160, spacing):
                  for cx in range(260 + ((cy // spacing) % 2) * 26, width - 260, spacing):
                      spot = (x - cx) ** 2 + (y - cy) ** 2 <= radius ** 2
                      halo = (x - cx) ** 2 + (y - cy) ** 2 <= (radius * 2) ** 2
                      arr[halo & mask] = [156, 84, 24]
                      arr[spot & mask] = [205, 113, 28]
              return arr

          def purple_blocks(width=1536, height=1024, seed=7):
              rng = np.random.default_rng(seed)
              small = rng.integers(0, 256, size=(height // 32, width // 32, 3), dtype=np.uint8)
              small[..., 0] = np.maximum(small[..., 0], 140)
              small[..., 1] = small[..., 1] // 3
              small[..., 2] = np.maximum(small[..., 2], 130)
              return np.asarray(Image.fromarray(small).resize((width, height), Image.Resampling.NEAREST).filter(ImageFilter.GaussianBlur(radius=3)))

          def striped_brown(width=1600, height=1000):
              y, x = np.mgrid[0:height, 0:width]
              arr = np.zeros((height, width, 3), dtype=np.uint8)
              arr[..., 0] = (80 + 80 * (np.sin(x / 19) > 0) + (y % 37)).astype(np.uint8)
              arr[..., 1] = (35 + 40 * (np.cos((x + y) / 23) > 0)).astype(np.uint8)
              arr[..., 2] = (20 + 80 * (np.sin(y / 17) > 0)).astype(np.uint8)
              return arr

          candidates = [
              ("visible_rust_spots_leaf", rust_spots_leaf()),
              ("no_visible_gradient_leaf", gradient_leaf()),
              ("not_sure_purple_blocks", purple_blocks()),
              ("not_sure_striped_brown", striped_brown()),
          ]
          for radius in [8, 10, 12, 16, 22, 30]:
              candidates.append((f"visible_rust_spots_r{radius}", rust_spots_leaf(radius=radius, spacing=max(48, radius * 6))))
          for seed in range(40):
              candidates.append((f"not_sure_noise_{seed:02d}", purple_blocks(seed=seed + 100)))

          session = ort.InferenceSession("app/assets/model/royacheck_a0_fp32.onnx", providers=["CPUExecutionProvider"])
          selected = {}
          diagnostics = []
          for name, arr in candidates:
              found_route, probs = infer(session, arr)
              diagnostics.append({"name": name, "route": found_route, "probabilities": {CLASS_NAMES[i]: round(float(probs[i]), 6) for i in range(len(CLASS_NAMES))}})
              selected.setdefault(found_route, (name, arr, probs))
              if {"visible_rust", "no_visible_rust", "not_sure"}.issubset(selected):
                  break

          missing = {"visible_rust", "no_visible_rust", "not_sure"} - set(selected)
          if missing:
              print(json.dumps({"missing": sorted(missing), "diagnostics": diagnostics}, indent=2))
              raise SystemExit("Could not generate route-variety synthetic fixtures.")

          fixtures = []
          for route_name in ["visible_rust", "no_visible_rust", "not_sure"]:
              name, arr, probs = selected[route_name]
              png_path = OUT / f"{name}.png"
              Image.fromarray(arr).save(png_path)
              fixtures.append({
                  "name": name,
                  "path": str(png_path),
                  "expected_route": route_name,
                  "probabilities": {CLASS_NAMES[i]: round(float(probs[i]), 6) for i in range(len(CLASS_NAMES))},
              })

          out = {"model_sha256": MODEL_SHA256, "fixtures": fixtures, "diagnostic_count": len(diagnostics)}
          Path("tmp/stage8-e2e/expected-routes.json").write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
      - name: Browser route-variety image-to-record smoke
        run: |
          python -m http.server 4173 --bind 127.0.0.1 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          ROYA_BASE_URL=http://127.0.0.1:4173/app/ node tests/browser-e2e.mjs tmp/stage8-e2e/expected-routes.json
      - name: Core asset hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              "app/index.html",
              "app/styles.css",
              "app/app.js",
              "app/preprocess.js",
              "app/manifest.webmanifest",
              "app/sw.js",
              "app/assets/icon.svg",
              "app/assets/model/royacheck_a0_fp32.onnx",
              "app/vendor/onnxruntime-web/ort.wasm.min.mjs",
              "app/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs",
              "app/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm",
          ]
          files = []
          for path in paths:
              data = Path(path).read_bytes()
              files.append({"path": path, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          print("STAGE8_CORE_ASSET_HASHES_JSON_START")
          print(json.dumps(files, indent=2))
          print("STAGE8_CORE_ASSET_HASHES_JSON_END")
          PY
      - name: Evidence summary
        run: |
          {
            echo "## Stage 8 final minor smoke"
            echo "- commit: $GITHUB_SHA"
            echo "- npm test: PASS"
            echo "- browser route-variety image-to-record smoke: PASS"
            echo "- reference routes:"
            cat tmp/stage8-e2e/expected-routes.json
          } >> "$GITHUB_STEP_SUMMARY"
