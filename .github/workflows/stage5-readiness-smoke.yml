name: Stage 5 readiness smoke

on:
  push:
    branches:
      - chatgpt/stage-05-readiness-verification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record base environment
        run: |
          python --version
          pip --version
          node --version
          npm --version
          df -h .
          free -h

      - name: Install Python readiness packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision onnx onnxruntime ImageHash

      - name: Untrained MobileNetV3-Small ONNX export smoke
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import torch
          import torchvision
          import onnx
          import onnxruntime as ort
          import imagehash
          from PIL import Image
          from torchvision.models import mobilenet_v3_small

          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("onnx", onnx.__version__)
          print("onnxruntime", ort.__version__)
          print("imagehash", getattr(imagehash, "__version__", "installed"))

          model = mobilenet_v3_small(weights=None).eval()
          x = torch.zeros(1, 3, 224, 224)
          out = Path("stage5_dummy_mobilenetv3_small.onnx")
          torch.onnx.export(
              model,
              x,
              out.as_posix(),
              input_names=["input"],
              output_names=["output"],
              opset_version=18,
              dynamo=False,
          )
          onnx.checker.check_model(onnx.load(out.as_posix()))
          sess = ort.InferenceSession(out.as_posix(), providers=["CPUExecutionProvider"])
          y = sess.run(None, {"input": x.numpy()})
          print("onnx_bytes", out.stat().st_size)
          print("onnx_sha256", hashlib.sha256(out.read_bytes()).hexdigest())
          print("ort_output_shape", y[0].shape)

          im = Image.new("RGB", (224,224), "white")
          print("phash_smoke", imagehash.phash(im, hash_size=8))
          PY

      - name: Upload dummy ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage5-dummy-onnx
          path: stage5_dummy_mobilenetv3_small.onnx
          if-no-files-found: error
          retention-days: 1

      - name: Synthetic evaluation-control smoke
        run: |
          python - <<'PY'
          import csv, math, tempfile
          from pathlib import Path
          from PIL import Image, ImageDraw
          import imagehash

          class DSU:
              def __init__(self, n):
                  self.p=list(range(n))
              def find(self, x):
                  while self.p[x] != x:
                      self.p[x] = self.p[self.p[x]]
                      x = self.p[x]
                  return x
              def union(self, a,b):
                  ra,rb=self.find(a),self.find(b)
                  if ra != rb:
                      self.p[rb]=ra

          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              ims=[]
              base=Image.new("RGB",(256,256),"white")
              d=ImageDraw.Draw(base); d.rectangle((60,60,180,180),fill="black")
              ims.append(base)
              ims.append(base.copy())
              variant=base.copy(); d2=ImageDraw.Draw(variant); d2.rectangle((181,181,183,183),fill="black")
              ims.append(variant)
              other=Image.new("RGB",(256,256),"white"); d3=ImageDraw.Draw(other); d3.ellipse((40,40,210,210),fill="black")
              ims.append(other)
              paths=[]
              for i,im in enumerate(ims):
                  p=td/f"img_{i}.png"; im.save(p); paths.append(p)

              hashes=[imagehash.phash(Image.open(p),hash_size=8) for p in paths]
              dsu=DSU(len(paths))
              for i in range(len(paths)):
                  for j in range(i+1,len(paths)):
                      if hashes[i]-hashes[j] <= 5:
                          dsu.union(i,j)
              groups={}
              for i,p in enumerate(paths):
                  groups.setdefault(dsu.find(i),[]).append(p.name)
              print("synthetic_phash_groups", sorted(sorted(v) for v in groups.values()))
              assert any({"img_0.png","img_1.png"}.issubset(set(v)) for v in groups.values())

              nR,nH,nO=94,120,300
              gates={
                  "max_confident_misses": math.floor(0.05*nR),
                  "min_rust_coverage_count": math.ceil(0.50*nR),
                  "min_healthy_coverage_count": math.ceil(0.50*nH),
                  "max_other_to_nvr": math.floor(0.10*nO),
              }
              print("integer_gate_smoke", gates)
              assert gates["max_confident_misses"] == 4

              manifest=td/"manifest.csv"
              with manifest.open("w", newline="") as fh:
                  w=csv.writer(fh); w.writerow(["file_id","partition"]); w.writerow(["dummy-a","train"]); w.writerow(["dummy-b","validation"])
              print("manifest_smoke_lines", manifest.read_text().strip().splitlines())
          PY

      - name: Pretrained MobileNetV3-Small artifact access smoke
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import torch
          from torchvision.models import mobilenet_v3_small, MobileNet_V3_Small_Weights

          weights = MobileNet_V3_Small_Weights.IMAGENET1K_V1
          print("weights_url", weights.url)
          model = mobilenet_v3_small(weights=weights).eval()
          with torch.no_grad():
              y = model(torch.zeros(1, 3, 224, 224))
          print("pretrained_output_shape", tuple(y.shape))

          cache = Path(torch.hub.get_dir()) / "checkpoints"
          files = sorted(cache.glob("mobilenet_v3_small*.pth"))
          if not files:
              raise SystemExit("expected MobileNetV3-Small cached weight file not found")
          for p in files:
              print("weight_file", p.name)
              print("weight_bytes", p.stat().st_size)
              print("weight_sha256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Install ORT Web pinned runtime
        run: |
          mkdir -p /tmp/royacheck-stage5-web
          cd /tmp/royacheck-stage5-web
          npm init -y
          npm install --save-exact onnxruntime-web@1.30.0
          npm ls onnxruntime-web
          node - <<'JS'
          const ort = require("onnxruntime-web");
          console.log("ort-web-loaded", typeof ort.InferenceSession === "function");
          JS
